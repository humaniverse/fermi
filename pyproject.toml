[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fermi-estimation"
version = "0.1.0.dev0"
description = "Bayesian Fermi estimation in Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Matthew Gwynfryn Thomas" }]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.urls]
Documentation = "https://humaniverse.github.io/fermi/"
Repository = "https://github.com/humaniverse/fermi"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["python/src"]
include = ["fermi_estimation"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["python/tests"]
